name: Media Manager image

# Builds the AltMount image that Media Manager installs alongside itself.
# The tests run first; the image is pushed only from the media-manager branch
# and from mm-v* tags.
on:
  push:
    branches: [media-manager]
    tags: ["mm-v*"]
  pull_request:
    branches: [media-manager]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/media-manager52/altmount

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        working-directory: frontend
        env:
          npm_package_version: mm-${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          tags="${IMAGE}:sha-${GITHUB_SHA}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tags="${tags},${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:mm-stable"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ci
          build-args: |
            VERSION=mm-${{ github.sha }}
            COMMIT=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Media-manager52/altmount
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=AltMount with Media Manager's fixes, installed together with Media Manager
          cache-from: type=gha
          cache-to: type=gha,mode=max
